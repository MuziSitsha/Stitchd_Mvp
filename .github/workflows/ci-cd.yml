name: STITCHD CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Validate API and Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Detect ESLint config
        id: eslint-config
        shell: bash
        run: |
          if compgen -G "apps/api/.eslintrc*" > /dev/null || compgen -G ".eslintrc*" > /dev/null || compgen -G "eslint.config.*" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint API
        if: steps.eslint-config.outputs.present == 'true'
        run: yarn workspace @stitchd/api lint

      - name: Test API
        run: yarn workspace @stitchd/api test --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Build API
        run: yarn workspace @stitchd/api build

      - name: Build Admin
        run: yarn workspace @stitchd/admin build
